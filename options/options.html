<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="optionsTitle">Pomodoro Timer - Settings</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="container">
    <h1 data-i18n="optionsHeading">🍅 Pomodoro Timer Settings</h1>

    <div class="settings-form">
      <div class="form-group">
        <label for="pomodoro-duration" data-i18n="focusDuration">Focus Duration (minutes)</label>
        <input type="number" id="pomodoro-duration" min="1" max="120" value="25">
      </div>

      <div class="form-group">
        <label for="short-break-duration" data-i18n="shortBreakDuration">Short Break Duration (minutes)</label>
        <input type="number" id="short-break-duration" min="1" max="60" value="5">
      </div>

      <div class="form-group">
        <label for="long-break-duration" data-i18n="longBreakDuration">Long Break Duration (minutes)</label>
        <input type="number" id="long-break-duration" min="1" max="60" value="15">
      </div>

      <div class="form-group">
        <label for="long-break-interval" data-i18n="longBreakInterval">Long Break After (pomodoros)</label>
        <input type="number" id="long-break-interval" min="1" max="10" value="4">
      </div>

      <div class="form-group">
        <label for="language-select" data-i18n="language">Language</label>
        <select id="language-select">
          <option value="en" data-i18n="languageEnglish">English</option>
          <option value="zh" data-i18n="languageChinese">中文</option>
        </select>
      </div>

      <div class="form-group checkbox-group">
        <label>
          <input type="checkbox" id="auto-pause-enabled">
          <span data-i18n="autoPauseEnabled">Enable auto-pause time window</span>
        </label>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="auto-pause-start" data-i18n="autoPauseStart">Auto-pause start time</label>
          <input type="time" id="auto-pause-start" value="00:00">
        </div>
        <div class="form-group">
          <label for="auto-pause-end" data-i18n="autoPauseEnd">Auto-pause end time</label>
          <input type="time" id="auto-pause-end" value="00:00">
        </div>
      </div>

      <div class="actions">
        <button id="btn-save" class="btn btn-primary" data-i18n="saveSettings">Save Settings</button>
        <button id="btn-reset" class="btn btn-secondary" data-i18n="resetDefaults">Reset to Defaults</button>
      </div>

      <div class="actions">
        <button id="btn-export" class="btn btn-primary" data-i18n="exportData">Export Data (JSON)</button>
        <label class="btn btn-secondary file-picker">
          <span data-i18n="importData">Import Data (JSON)</span>
          <input type="file" id="import-file" accept=".json,application/json">
        </label>
      </div>

      <div id="status-message" class="status-message"></div>
    </div>

    <div class="footer">
      <a href="#" id="btn-back" data-i18n="backToTimer">← Back to Timer</a>
    </div>
  </div>

  <script src="../core/i18n.js"></script>
  <script src="options.js"></script>
</body>
</html>
